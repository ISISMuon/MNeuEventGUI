name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install package and pyinstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: build executable
        run: pyinstaller MNeuEventGUI.spec

      - name: package executable
        shell: bash
        run: |
          name="MNeuEventGUI-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/MNeuEventGUI.exe "$name.exe"
          else
            # ditto preserves the symlinks and permissions inside the bundle.
            ditto -c -k --keepParent dist/MNeuEventGUI.app "$name.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            MNeuEventGUI-*.exe
            MNeuEventGUI-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
