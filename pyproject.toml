[build-system]
requires = ['cython', 'numpy', 'setuptools', 'pyside6']
build-backend = 'setuptools.build_meta'

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
MNeuEventGUI = ["assets/*.png"]

[project]
name = 'MNeuEventGUI'

version = "0.1.1"

requires-python = ">=3.12"
dependencies = ['numpy==2.5.5', 'h5py==3.16.0', 'plotly==7.2.0', 'pyside6==6.12.0', 'dash[testing]==4.5.1', 'dash_daq==0.6.0', 'dash-ag-grid==35.3.0', 'dash_bootstrap_components==2.0.4', 'MNeuEventLib==0.6.0']
authors = [{name='Anthony Lim', email='anthony.lim@stfc.ac.uk'}, {name='Alex H. Room', email='alex.room@stfc.ac.uk'}]
description = 'GUI for reading, filtering, and writing ISIS event mode data.'
readme = 'README.md'

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["E", "W"]
ignore = ["BLE001", "FA102"]
